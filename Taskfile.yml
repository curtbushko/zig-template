version: "3"

# Built-in variables used: ROOT_DIR
output: prefixed

vars:
  BINARY:
    sh: basename -s .git $(git remote get-url origin 2>/dev/null || echo "zig-template")
  ZIG_CACHE_MAX_KIB: '{{default "10485760" .ZIG_CACHE_MAX_KIB}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  cache:guard:
    internal: true
    run: once
    desc: Discard the rebuildable local Zig cache when it exceeds the size limit
    cmds:
      - |
        bash -euo pipefail <<'BASH'
        command -v du >/dev/null 2>&1 || {
          printf 'cache guard: du is required\n' >&2
          exit 1
        }
        command -v find >/dev/null 2>&1 || {
          printf 'cache guard: find is required\n' >&2
          exit 1
        }
        command -v awk >/dev/null 2>&1 || {
          printf 'cache guard: awk is required\n' >&2
          exit 1
        }

        cache_max_kib='{{.ZIG_CACHE_MAX_KIB}}'
        [[ "$cache_max_kib" =~ ^[1-9][0-9]*$ ]] || {
          printf 'cache guard: ZIG_CACHE_MAX_KIB must be a positive integer\n' >&2
          exit 1
        }

        [[ ! -L .zig-cache && (! -e .zig-cache || -d .zig-cache) ]] || {
          printf 'cache guard: refusing unsafe .zig-cache path\n' >&2
          exit 1
        }
        [[ -d .zig-cache ]] || exit 0

        cache_size_kib="$(du -sk -- .zig-cache | awk '{ print $1 }')"
        ((cache_size_kib > cache_max_kib)) || exit 0

        printf 'cache guard: clearing .zig-cache (%s KiB exceeds %s KiB limit)\n' "$cache_size_kib" "$cache_max_kib"
        find .zig-cache -depth -mindepth 1 -delete
        BASH

  build:
    desc: Build the project (optimized for debug)
    deps: [cache:guard]
    cmds:
      - zig build

  build:release:
    desc: Build optimized release binary
    deps: [cache:guard]
    cmds:
      - zig build -Doptimize=ReleaseSafe

  build:fast:
    desc: Build optimized for speed (ReleaseFast)
    deps: [cache:guard]
    cmds:
      - zig build -Doptimize=ReleaseFast

  build:small:
    desc: Build optimized for size (ReleaseSmall)
    deps: [cache:guard]
    cmds:
      - zig build -Doptimize=ReleaseSmall

  run:
    desc: Build and run the executable
    deps: [cache:guard]
    cmds:
      - zig build run

  check:
    desc: Check if code compiles without building
    deps: [cache:guard]
    cmds:
      - zig build check

  test:
    desc: Run all tests
    cmds:
      - zig build test

  test:verbose:
    desc: Run tests with verbose output
    cmds:
      - zig build test --summary all

  fmt:
    desc: Format all Zig source files
    cmds:
      - zig fmt src/

  fmt:check:
    desc: Check if files are formatted correctly
    cmds:
      - zig fmt --check src/

  lint:zlint:
    desc: Run zlint static analysis
    cmds:
      - zlint

  lint:
    desc: Run all linting checks
    cmds:
      - task: fmt:check
      - task: lint:zlint

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf zig-out zig-cache .zig-cache

  install:
    desc: Install the binary to zig-out/bin
    deps: [cache:guard]
    cmds:
      - zig build install -Doptimize=ReleaseSafe

  docs:
    desc: Generate documentation
    cmds:
      - zig build-lib src/root.zig -femit-docs -fno-emit-bin

  ci:
    desc: Run CI checks (fmt, lint, build, test)
    cmds:
      - task: fmt:check
      - task: lint:zlint
      - task: build
      - task: test
